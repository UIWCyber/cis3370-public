<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIS 3370 - Intrusion Detection Systems</title><style>
:root{--red:#CB333B;--red-dk:#A32830;--bg:#f6f7f9;--surface:#fff;--surface2:#eef0f3;--text:#1c1e22;--muted:#5b616b;--line:#e2e3e8;--code:#eef1f5;}
@media(prefers-color-scheme:dark){:root{--bg:#14161a;--surface:#1d2025;--surface2:#262a30;--text:#e7e9ec;--muted:#99a1ac;--line:#333941;--code:#232830;}}
:root[data-theme=dark]{--bg:#14161a;--surface:#1d2025;--surface2:#262a30;--text:#e7e9ec;--muted:#99a1ac;--line:#333941;--code:#232830;}
:root[data-theme=light]{--bg:#f6f7f9;--surface:#fff;--surface2:#eef0f3;--text:#1c1e22;--muted:#5b616b;--line:#e2e3e8;--code:#eef1f5;}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.55}
header.top{background:var(--red);color:#fff;padding:1rem 1.3rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
header.top h1{margin:0;font-size:1.15rem}header.top .sub{font-size:.8rem;opacity:.9}
header.top .tools{display:flex;gap:.5rem}
header.top button{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:.35rem .7rem;font-size:.8rem;cursor:pointer}
.wrap{display:flex;min-height:calc(100vh - 62px)}
nav{width:300px;flex:none;border-right:1px solid var(--line);background:var(--surface);padding:.5rem;overflow-y:auto;max-height:calc(100vh - 62px)}
nav input.search{width:100%;padding:.45rem .6rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:.4rem}
nav .sec{margin-bottom:.1rem}
nav .grp{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:.6rem .3rem .2rem;padding:.15rem .25rem;cursor:pointer;user-select:none;display:flex;align-items:center;gap:.35rem;border-radius:6px}
nav .grp:hover{background:var(--surface2)}
nav .grp::before{content:"\25B8";font-size:.7em;color:var(--muted);transition:transform .12s ease;flex:none}
nav .sec:not(.collapsed)>.grp::before{transform:rotate(90deg)}
nav .sec.collapsed>.body{display:none}
nav .grp.sublab{text-transform:none;font-weight:600;font-size:.82rem;margin:.15rem .3rem .1rem .4rem;opacity:.9}
nav a{display:block;padding:.4rem .6rem;border-radius:8px;color:var(--text);text-decoration:none;font-size:.88rem;cursor:pointer}
nav .sec .sec a{margin-left:.35rem}
nav a:hover{background:var(--surface2)}nav a.active{background:var(--red);color:#fff}
nav a.ext::after{content:" \2197";color:var(--muted);font-size:.8em}
nav.searching .sec>.body{display:block}
main{flex:1;padding:1.3rem 2rem;overflow-x:auto;max-width:940px}
main img{max-width:100%}main h1,main h2,main h3{color:var(--red);line-height:1.25}main h1{font-size:1.5rem;border-bottom:2px solid var(--line);padding-bottom:.3rem}
main table{border-collapse:collapse;width:100%;margin:.8rem 0;font-size:.92rem;display:block;overflow-x:auto}
main th,main td{border:1px solid var(--line);padding:.45rem .6rem;text-align:left;vertical-align:top}main th{background:var(--surface2)}
main code{background:var(--code);padding:.1rem .35rem;border-radius:4px;font-family:ui-monospace,Menlo,monospace;font-size:.9em}
main pre{background:var(--code);padding:.8rem 1rem;border-radius:8px;overflow-x:auto}main pre code{background:none;padding:0}
main blockquote{border-left:4px solid var(--red);margin:.6rem 0;padding:.2rem .9rem;color:var(--muted);background:var(--surface2);border-radius:0 8px 8px 0}
.hint{color:var(--muted);font-size:.85rem;margin-top:.3rem}
@media(max-width:760px){.wrap{flex-direction:column}nav{width:auto;max-height:none;border-right:none;border-bottom:1px solid var(--line)}}
@media print{header.top,nav{display:none}main{max-width:none;padding:0}.wrap{display:block}}
</style></head><body>
<header class="top"><div><h1>CIS 3370 - Intrusion Detection Systems</h1>
<div class="sub">University of the Incarnate Word - Dr. Gonzalo D Parra - resource browser</div></div>
<div class="tools"><button onclick="window.print()">Download (p)</button><button onclick="tt()">Theme</button></div></header>
<div class="wrap"><nav id="nav"></nav><main id="main"></main></div>
<script>
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function inl(s){
  s=s.replace(/`([^`]+)`/g,(m,c)=>'<code>'+esc(c)+'</code>');
  s=s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img alt="$1" src="$2">');
  s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/__([^_]+)__/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<em>$2</em>');
  return s;
}
function md(src){
  const L=src.replace(/\r/g,'').split('\n');const o=[];let i=0;
  const sep=l=>/^\s*\|?\s*:?-{2,}/.test(l)&&l.includes('-');
  while(i<L.length){let l=L[i];
    if(/^```/.test(l)){let b=[];i++;while(i<L.length&&!/^```/.test(L[i])){b.push(L[i]);i++;}i++;o.push('<pre><code>'+esc(b.join('\n'))+'</code></pre>');continue;}
    let h=l.match(/^(#{1,6})\s+(.*)$/);if(h){o.push('<h'+h[1].length+'>'+inl(esc(h[2]))+'</h'+h[1].length+'>');i++;continue;}
    if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)){o.push('<hr>');i++;continue;}
    if(l.includes('|')&&i+1<L.length&&sep(L[i+1])){
      const hd=l.split('|').map(c=>c.trim()).filter((c,x,a)=>!(x===0&&c==='')&&!(x===a.length-1&&c===''));
      i+=2;const rs=[];while(i<L.length&&L[i].includes('|')&&L[i].trim()){rs.push(L[i].split('|').map(c=>c.trim()).filter((c,x,a)=>!(x===0&&c==='')&&!(x===a.length-1&&c===''))); i++;}
      o.push('<table><thead><tr>'+hd.map(x=>'<th>'+inl(esc(x))+'</th>').join('')+'</tr></thead><tbody>'+rs.map(r=>'<tr>'+r.map(c=>'<td>'+inl(esc(c))+'</td>').join('')+'</tr>').join('')+'</tbody></table>');continue;}
    if(/^\s*>/.test(l)){let b=[];while(i<L.length&&/^\s*>/.test(L[i])){b.push(L[i].replace(/^\s*>\s?/,''));i++;}o.push('<blockquote>'+inl(esc(b.join(' ')))+'</blockquote>');continue;}
    if(/^\s*\d+\.\s+/.test(l)){let b=[];while(i<L.length&&/^\s*\d+\.\s+/.test(L[i])){b.push(L[i].replace(/^\s*\d+\.\s+/,''));i++;}o.push('<ol>'+b.map(x=>'<li>'+inl(esc(x))+'</li>').join('')+'</ol>');continue;}
    if(/^\s*[-*+]\s+/.test(l)){let b=[];while(i<L.length&&/^\s*[-*+]\s+/.test(L[i])){b.push(L[i].replace(/^\s*[-*+]\s+/,''));i++;}o.push('<ul>'+b.map(x=>'<li>'+inl(esc(x))+'</li>').join('')+'</ul>');continue;}
    if(l.trim()===''){i++;continue;}
    let b=[l];i++;while(i<L.length&&L[i].trim()!==''&&!/^(#{1,6}\s|```|\s*>|\s*[-*+]\s|\s*\d+\.\s)/.test(L[i])&&!(L[i].includes('|')&&i+1<L.length&&sep(L[i+1]))){b.push(L[i]);i++;}
    o.push('<p>'+inl(esc(b.join(' ')))+'</p>');}
  return o.join('\n');
}
function typing(){const a=document.activeElement;return a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);}
document.addEventListener('keydown',e=>{if(e.key==='p'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!typing()){e.preventDefault();window.print();}});
function tt(){const r=document.documentElement;const c=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const n=c==='dark'?'light':'dark';r.setAttribute('data-theme',n);try{localStorage.setItem('csec-theme',n);}catch(e){}}
(function(){try{const t=localStorage.getItem('csec-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<script>const EMBED={};
const NAV=[{"grp": "Presentation", "links": [{"label": "Course Hub", "href": "course-hub.html", "ext": true}, {"label": "Course Outline", "href": "course-outline.html", "ext": true}, {"label": "NSL-KDD: dataset issues", "href": "nsl-kdd-issues.html", "ext": true}, {"label": "NSL-KDD: every column, verified", "href": "nsl-kdd-features.html", "ext": true}]}, {"grp": "Lecture Decks", "links": [{"label": "Lecture 1: Build an IDS End to End", "href": "slides/lecture-01-course-launch.html", "ext": true}, {"label": "Lecture 2: awk for Log Analysis", "href": "slides/lecture-02-awk-log-analysis.html", "ext": true}, {"label": "Lecture 3: sed and Normalization", "href": "slides/lecture-03-sed-normalization.html", "ext": true}, {"label": "Lecture 4: Analyzing a Dataset Before You Model It", "href": "slides/lecture-04-data-analysis-nsl-kdd.html", "ext": true}, {"label": "Lecture 5: Generate The Data", "href": "slides/lecture-05-generate-the-data.html", "ext": true}, {"label": "Lecture 6: Collect Zeek Suricata", "href": "slides/lecture-06-collect-zeek-suricata.html", "ext": true}, {"label": "Lecture 7: Structure Fields And Names", "href": "slides/lecture-07-structure-fields-and-names.html", "ext": true}, {"label": "Lecture 8: Store Elasticsearch", "href": "slides/lecture-08-store-elasticsearch.html", "ext": true}, {"label": "Lecture 9: Preprocess Encode Scale", "href": "slides/lecture-09-preprocess-encode-scale.html", "ext": true}, {"label": "Lecture 10: Baselines You Must Beat", "href": "slides/lecture-10-baselines-you-must-beat.html", "ext": true}, {"label": "Lecture 11: Evaluation Metrics That Matter", "href": "slides/lecture-11-evaluation-metrics-that-matter.html", "ext": true}, {"label": "Lecture 12: Time Series And Splitting By Time", "href": "slides/lecture-12-time-series-and-splitting-by-time.html", "ext": true}, {"label": "Lecture 16: Infer And The Agent", "href": "slides/lecture-16-infer-and-the-agent.html", "ext": true}, {"label": "Lecture 17: Alerting And The False Positive Budget", "href": "slides/lecture-17-alerting-and-the-false-positive-budget.html", "ext": true}, {"label": "Lecture 18: Dashboards For The Decider", "href": "slides/lecture-18-dashboards-for-the-decider.html", "ext": true}, {"label": "Lecture 19: Reading A Paper Like An Engineer", "href": "slides/lecture-19-reading-a-paper-like-an-engineer.html", "ext": true}, {"label": "Lecture 20: Reproduction Workshop", "href": "slides/lecture-20-reproduction-workshop.html", "ext": true}]}, {"grp": "Capstone Decks", "links": [{"label": "Capstone: Kick-off Guide", "href": "slides/lecture-98-capstone-kickoff-guide.html", "ext": true}]}, {"grp": "Capstone (fillable forms)", "links": [{"label": "Capstone Proposal", "href": "capstone/capstone-proposal.html", "ext": true}, {"label": "Capstone Readiness Checklist", "href": "capstone/capstone-readiness-checklist.html", "ext": true}, {"label": "Capstone Grading Rubric (all components)", "href": "capstone/capstone-grading-rubric.html", "ext": true}, {"label": "Capstone Presentation Rubric", "href": "capstone/capstone-presentation-rubric.html", "ext": true}, {"label": "Capstone Peer Feedback Form", "href": "capstone/capstone-peer-feedback.html", "ext": true}, {"label": "Capstone Team Formation Guide", "href": "capstone/capstone-team-formation.html", "ext": true}]}];
function welcome(){return md("# Course Resources\n\nUse the left sidebar to open any document; everything opens in a new tab.\n\nPress **p** on any document to download or print it.\n\n## Quick links\n\n- [Course Hub](course-hub.html) and [Course Outline](course-outline.html)\n- [Capstone Kick-off deck](slides/lecture-01-capstone-kickoff-guide.html) (how the project and grading work)\n- [Capstone forms](capstone/capstone-proposal.html) (fill in your browser, download as PDF)\n\n> Labs, quizzes, and lecture content are delivered through **Cengage MindTap via Canvas**. This site hosts everything for the semester-long group capstone: the kick-off methodology, the presentation decks and worked example, and the fillable forms.");}
function show(key){document.getElementById('main').innerHTML=md(EMBED[key]||'# Not found');document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.k===key));location.hash=encodeURIComponent(key);window.scrollTo(0,0);}
const NAVSTORE='csec-nav-collapsed';
const _stored=(function(){try{return localStorage.getItem(NAVSTORE);}catch(e){return null;}})();
const FIRST=_stored===null;
const COLL=new Set(FIRST?[]:JSON.parse(_stored));
function saveColl(){try{localStorage.setItem(NAVSTORE,JSON.stringify([...COLL]));}catch(e){}}
function mkSection(title,sub){const sec=document.createElement('div');sec.className='sec';
  const id=(sub?'lab:':'grp:')+title;
  if(FIRST&&sub)COLL.add(id);
  if(COLL.has(id))sec.classList.add('collapsed');
  const h=document.createElement('div');h.className='grp'+(sub?' sublab':'');h.textContent=title;
  h.onclick=()=>{sec.classList.toggle('collapsed');if(sec.classList.contains('collapsed'))COLL.add(id);else COLL.delete(id);saveColl();};
  const body=document.createElement('div');body.className='body';
  sec.appendChild(h);sec.appendChild(body);return {sec,body};}
function build(){const nav=document.getElementById('nav');
  const s=document.createElement('input');s.className='search';s.placeholder='Search...';s.oninput=()=>{const q=s.value.trim().toLowerCase();nav.classList.toggle('searching',!!q);nav.querySelectorAll('a').forEach(a=>{a.style.display=a.textContent.toLowerCase().includes(q)?'':'none';});};nav.appendChild(s);
  NAV.forEach(g=>{const gs=mkSection(g.grp,false);nav.appendChild(gs.sec);
    if(g.labs){g.labs.forEach(l=>{const ls=mkSection(l.lab,true);gs.body.appendChild(ls.sec);
      l.files.forEach(f=>{const a=document.createElement('a');a.textContent=f.label;a.dataset.k=f.key;a.onclick=()=>show(f.key);ls.body.appendChild(a);});});}
    else{(g.links||[]).forEach(x=>{const a=document.createElement('a');a.textContent=x.label;if(x.ext){a.href=x.href;a.target='_blank';a.rel='noopener';a.className='ext';}else{a.dataset.k=x.key;a.onclick=()=>show(x.key);}gs.body.appendChild(a);});}});
  const h=decodeURIComponent(location.hash.slice(1));if(h&&EMBED[h])show(h);else document.getElementById('main').innerHTML=welcome();}
build();
</script></body></html>
